<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buggy Intelligence Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header>
      <h1>Buggy Intelligence Dashboard</h1>
      <p id="connection-status">Loading live state…</p>
    </header>
    <main>
      <section><h2>Driver monitoring</h2><dl id="drowsiness"></dl></section>
      <section><h2>GPS position</h2><dl id="gps"></dl></section>
      <section><h2>Geo-fenced advisory</h2><dl id="geofence"></dl></section>
      <section><h2>Alcohol-vapour sensor</h2><dl id="alcohol"></dl></section>
      <section><h2>Relay states</h2><dl id="relays"></dl></section>
      <section><h2>Recent road hazards</h2><div id="hazards"></div></section>
      <section class="wide"><h2>Raw ESP32-S3 telemetry</h2><pre id="esp32"></pre></section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
